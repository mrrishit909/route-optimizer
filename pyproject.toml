[project]
name = "route-optimizer"
version = "0.1.0"
description = "Vehicle routing with time windows and capacities, live re-planning over WebSockets"
requires-python = ">=3.12"
dependencies = ["ortools>=9.11", "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "httpx>=0.27", "websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.11"]

[tool.setuptools]
packages = ["routing"]

[tool.pytest.ini_options]
addopts = "--cov=routing --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.mypy]
strict = true
files = ["routing"]
[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true
